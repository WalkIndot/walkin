<title>WalkIn. — Waiting Area Card</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Serif+Display:ital@0;1&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 20px;
  }

  /* ── CARD — same width as poster, shorter height ── */
  .card {
    background: #0c0c0a;
    border: 1px solid #2a2a2a;
    width: 480px;
    height: 672px;
    padding: 48px 48px 40px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Gold top rule — identical to poster */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: #c9a84c;
  }

  /* ── WORDMARK — identical to poster ── */
  .wordmark {
    font-family: 'DM Serif Display', serif;
    font-size: 32px;
    color: #f5f0e6;
    margin-bottom: 32px;
    letter-spacing: -0.5px;
  }

  .wordmark span { color: #c9a84c; }

  .tagline {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: #555;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 44px;
  }

  /* ── HEADLINE ── */
  .headline {
    font-family: 'DM Serif Display', serif;
    font-size: 36px;
    color: #f5f0e6;
    line-height: 1.1;
    margin-bottom: 32px;
    letter-spacing: -0.5px;
  }

  .headline em { color: #c9a84c; font-style: italic; }

  .subtext {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: #666;
    line-height: 1.6;
    margin-bottom: 44px;
    letter-spacing: 0.3px;
  }

  /* ── QR SECTION — identical layout to poster ── */
  .qr-section {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 0;
    width: 100%;
  }

  .qr-wrap {
    background: #ffffff;
    padding: 2px;
    flex-shrink: 0;
    width: 184px;
    height: 184px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .qr-wrap img {
    width: 100%;
    height: 100%;
    display: block;
  }

  .qr-info { flex: 1; }

  .qr-step {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 16px;
  }

  .qr-step:last-child { margin-bottom: 0; }

  .step-num {
    width: 22px;
    height: 22px;
    background: #c9a84c;
    color: #0c0c0a;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .step-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: #888;
    line-height: 1.5;
    letter-spacing: 0.3px;
  }

  .step-text strong {
    color: #f5f0e6;
    display: block;
    margin-bottom: 2px;
    font-weight: 600;
  }


  /* ── SCAN ME ── */
  .scan-me {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    font-weight: 400;
    color: #f5f0e6;
    letter-spacing: -0.5px;
    margin-top: 12px;
    text-align: center;
  }

  .scan-me em {
    font-style: italic;
    color: #c9a84c;
  }

  /* ── FOOTER — identical to poster ── */
  .divider {
    border: none;
    border-top: 1px solid #1e1e1e;
    margin-bottom: 20px;
  }

  .footer-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .footer-left {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: #888;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .footer-right {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: #777;
    letter-spacing: 0.5px;
  }

  /* ── PRINT ── */
  @page {
    size: 5in 7in;
    margin: 0;
  }
  @media print {
    body { background: white; padding: 0; margin: 0; display: block; }
    .card {
      border: none;
      width: 5in;
      height: 7in;
      padding: 0.5in 0.5in 0.4in;
      page-break-after: avoid;
      display: flex;
      flex-direction: column;
    }
  }
</style>
