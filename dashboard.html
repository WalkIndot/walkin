<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WalkIn. Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #222222;
    --border: #2e2e2e;
    --text: #f0ede8;
    --muted: #888;
    --accent: #c8f060;
    --accent-dim: #a0c040;
    --red: #ff5c5c;
    --orange: #ff9a3c;
    --yellow: #ffd460;
    --blue: #60b8f0;
    --green: #60e090;
    --grey: #666;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    min-height: 100vh;
  }

  /* ── LOGIN ── */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
  }

  .login-box {
    width: 360px;
    padding: 48px 40px;
    border: 1px solid var(--border);
    background: var(--surface);
  }

  .login-wordmark {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -1px;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .login-sub {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 36px;
  }

  .login-box label {
    display: block;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .login-box input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    padding: 10px 12px;
    margin-bottom: 20px;
    outline: none;
    transition: border-color 0.2s;
  }

  .login-box input:focus { border-color: var(--accent); }

  .login-btn {
    width: 100%;
    background: var(--accent);
    color: #0f0f0f;
    border: none;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 13px;
    padding: 12px;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: background 0.2s;
  }

  .login-btn:hover { background: var(--accent-dim); }

  .login-error {
    color: var(--red);
    font-size: 12px;
    margin-top: 12px;
    display: none;
  }

  /* ── DASHBOARD ── */
  #dashboard { display: none; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .wordmark {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--accent);
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 20px;
    color: var(--muted);
    font-size: 12px;
  }

  .logout-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 6px 12px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .logout-btn:hover { border-color: var(--red); color: var(--red); }

  .main {
    padding: 32px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .section-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 20px;
  }

  .section-title {
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }

  .section-count {
    font-size: 11px;
    color: var(--muted);
  }

  /* ── TABLE ── */
  .table-wrap {
    border: 1px solid var(--border);
    overflow-x: auto;
    margin-bottom: 48px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    background: var(--surface);
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 10px 16px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }

  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface2); }

  td {
    padding: 12px 16px;
    color: var(--text);
    white-space: nowrap;
  }

  .td-muted { color: var(--muted); }

  /* ── STATE BADGES ── */
  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 500;
    padding: 3px 8px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .badge-not_due     { background: #1a2a1a; color: var(--green); }
  .badge-due_soon    { background: #2a2a1a; color: var(--yellow); }
  .badge-due         { background: #2a1f1a; color: var(--orange); }
  .badge-overdue     { background: #2a1a1a; color: var(--red); }
  .badge-lapsed      { background: #1a1a2a; color: var(--blue); }
  .badge-reminded    { background: #1f1f1f; color: var(--muted); }
  .badge-opted_out   { background: #222; color: #555; }

  /* ── HOLIDAYS ── */
  .holiday-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }

  @media (max-width: 700px) {
    .holiday-grid { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 24px;
  }

  .card-title {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 20px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-group label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
  }

  .form-group input, .form-group textarea {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 9px 10px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }

  .form-group input:focus,
  .form-group textarea:focus { border-color: var(--accent); }

  .form-group textarea { resize: vertical; min-height: 60px; }

  .form-full { grid-column: 1 / -1; }

  .submit-btn {
    background: var(--accent);
    color: #0f0f0f;
    border: none;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 12px;
    padding: 10px 20px;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.2s;
    letter-spacing: 0.5px;
  }

  .submit-btn:hover { background: var(--accent-dim); }

  .form-msg {
    font-size: 11px;
    margin-top: 10px;
    display: none;
  }

  .form-msg.ok { color: var(--green); display: block; }
  .form-msg.err { color: var(--red); display: block; }

  /* ── HOLIDAY LIST ── */
  .holiday-list { display: flex; flex-direction: column; gap: 10px; }

  .holiday-item {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 12px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    gap: 12px;
  }

  .holiday-dates {
    font-size: 12px;
    color: var(--text);
    margin-bottom: 3px;
  }

  .holiday-note {
    font-size: 11px;
    color: var(--muted);
  }

  .delete-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    padding: 4px 10px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .delete-btn:hover { border-color: var(--red); color: var(--red); }

  .empty-state {
    color: var(--muted);
    font-size: 12px;
    padding: 16px 0;
  }

  /* ── LOADING ── */
  .loading {
    color: var(--muted);
    font-size: 12px;
    padding: 24px 0;
  }

  .spinner {
    display: inline-block;
    width: 10px;
    height: 10px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-wordmark">WalkIn.</div>
    <div class="login-sub">Nick Cuts — Dashboard</div>
    <label for="l-email">Email</label>
    <input type="email" id="l-email" placeholder="nick@nickcuts.com" autocomplete="username">
    <label for="l-pass">Password</label>
    <input type="password" id="l-pass" placeholder="••••••••" autocomplete="current-password">
    <button class="login-btn" onclick="doLogin()">Sign in</button>
    <div class="login-error" id="login-error">Incorrect email or password.</div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="topbar">
    <div class="wordmark">WalkIn.</div>
    <div class="topbar-right">
      <span id="topbar-name"></span>
      <button class="logout-btn" onclick="doLogout()">Sign out</button>
    </div>
  </div>

  <div class="main">

    <!-- CUSTOMERS -->
    <div class="section-header">
      <span class="section-title">Customers</span>
      <span class="section-count" id="customer-count"></span>
    </div>

    <div class="table-wrap">
      <div class="loading" id="customers-loading" style="padding:20px 16px">
        <span class="spinner"></span> Loading customers...
      </div>
      <table id="customers-table" style="display:none">
        <thead>
          <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Barber</th>
            <th>Frequency</th>
            <th>Last Visit</th>
            <th>State</th>
            <th>Opted Out</th>
          </tr>
        </thead>
        <tbody id="customers-tbody"></tbody>
      </table>
    </div>

    <!-- HOLIDAYS -->
    <div class="section-header">
      <span class="section-title">Nick's Holidays</span>
    </div>

    <div class="holiday-grid">

      <!-- ADD FORM -->
      <div class="card">
        <div class="card-title">Add Away Period</div>
        <div class="form-row">
          <div class="form-group">
            <label>Start Date</label>
            <input type="date" id="h-start">
          </div>
          <div class="form-group">
            <label>End Date</label>
            <input type="date" id="h-end">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group form-full">
            <label>Note (optional)</label>
            <input type="text" id="h-note" placeholder="e.g. Holiday in Spain">
          </div>
        </div>
        <button class="submit-btn" onclick="addHoliday()">Add Holiday</button>
        <div class="form-msg" id="holiday-msg"></div>
      </div>

      <!-- UPCOMING LIST -->
      <div class="card">
        <div class="card-title">Upcoming / Active</div>
        <div id="holiday-list-wrap">
          <div class="loading"><span class="spinner"></span> Loading...</div>
        </div>
      </div>

    </div>

  </div>
</div>

<script>
  const BASE = 'https://x8ki-letl-twmt.n7.xano.io/api:3BaFz8Nm';
  let authToken = sessionStorage.getItem('walkin_token') || null;

  // ── AUTO LOGIN IF TOKEN EXISTS ──
  if (authToken) showDashboard();

  // ── LOGIN ──
  async function doLogin() {
    const email = document.getElementById('l-email').value.trim();
    const pass  = document.getElementById('l-pass').value;
    const errEl = document.getElementById('login-error');
    errEl.style.display = 'none';

    try {
      const res = await fetch(BASE + '/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ field_value: email, password: pass })
      });
      const data = await res.json();
      if (!res.ok || !data.authToken) {
        errEl.style.display = 'block';
        return;
      }
      authToken = data.authToken;
      sessionStorage.setItem('walkin_token', authToken);
      showDashboard();
    } catch(e) {
      errEl.style.display = 'block';
    }
  }

  document.getElementById('l-pass').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  function doLogout() {
    sessionStorage.removeItem('walkin_token');
    authToken = null;
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
  }

  function showDashboard() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadCustomers();
    loadHolidays();
  }

  // ── CUSTOMERS ──
  async function loadCustomers() {
    try {
      const res = await fetch(BASE + '/customer/all', {
        headers: { 'Authorization': 'Bearer ' + authToken }
      });
      if (res.status === 401) { doLogout(); return; }
      const customers = await res.json();
      document.getElementById('customers-loading').style.display = 'none';
      document.getElementById('customers-table').style.display = 'table';

      if (!Array.isArray(customers) || customers.length === 0) {
        document.getElementById('customers-tbody').innerHTML =
          '<tr><td colspan="7" class="td-muted">No customers yet.</td></tr>';
        return;
      }

      document.getElementById('customer-count').textContent = customers.length + ' registered';

      const tbody = document.getElementById('customers-tbody');
      tbody.innerHTML = customers.map(c => {
        const lastVisit = c.last_visit_at
          ? new Date(c.last_visit_at).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' })
          : '—';
        const state = c.opted_out ? 'opted_out' : (c.reminder_state || 'not_due');
        const stateLabel = state.replace('_', ' ');
        return `<tr>
          <td>${esc(c.first_name || '—')}</td>
          <td class="td-muted">${esc(c.phone || '—')}</td>
          <td class="td-muted">${esc(c.barber_name || '—')}</td>
          <td class="td-muted">Every ${c.haircut_frequency_weeks || '?'} wks</td>
          <td class="td-muted">${lastVisit}</td>
          <td><span class="badge badge-${state}">${stateLabel}</span></td>
          <td class="td-muted">${c.opted_out ? 'Yes' : '—'}</td>
        </tr>`;
      }).join('');
    } catch(e) {
      document.getElementById('customers-loading').innerHTML = '<span style="color:var(--red)">Failed to load customers.</span>';
    }
  }

  // ── HOLIDAYS ──
  async function loadHolidays() {
    try {
      const res = await fetch(BASE + '/holidays');
      const holidays = await res.json();
      const wrap = document.getElementById('holiday-list-wrap');

      if (!Array.isArray(holidays) || holidays.length === 0) {
        wrap.innerHTML = '<div class="empty-state">No upcoming holidays.</div>';
        return;
      }

      wrap.innerHTML = '<div class="holiday-list">' +
        holidays.map(h => {
          const start = formatDate(h.start_date);
          const end   = formatDate(h.end_date);
          return `<div class="holiday-item">
            <div>
              <div class="holiday-dates">${start} → ${end}</div>
              ${h.note ? `<div class="holiday-note">${esc(h.note)}</div>` : ''}
            </div>
            <button class="delete-btn" onclick="deleteHoliday(${h.id})">Remove</button>
          </div>`;
        }).join('') +
      '</div>';
    } catch(e) {
      document.getElementById('holiday-list-wrap').innerHTML =
        '<div style="color:var(--red);font-size:12px">Failed to load holidays.</div>';
    }
  }

  async function addHoliday() {
    const start = document.getElementById('h-start').value;
    const end   = document.getElementById('h-end').value;
    const note  = document.getElementById('h-note').value.trim();
    const msg   = document.getElementById('holiday-msg');
    msg.className = 'form-msg';

    if (!start || !end) {
      msg.textContent = 'Please enter both start and end dates.';
      msg.className = 'form-msg err';
      return;
    }

    if (new Date(end) < new Date(start)) {
      msg.textContent = 'End date must be after start date.';
      msg.className = 'form-msg err';
      return;
    }

    try {
      const res = await fetch(BASE + '/holiday_add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          barber_id: 1,
          start_date: new Date(start).getTime(),
          end_date: new Date(end).getTime(),
          note: note || null
        })
      });

      if (!res.ok) throw new Error();

      msg.textContent = 'Holiday added.';
      msg.className = 'form-msg ok';
      document.getElementById('h-start').value = '';
      document.getElementById('h-end').value = '';
      document.getElementById('h-note').value = '';
      loadHolidays();
    } catch(e) {
      msg.textContent = 'Failed to add holiday.';
      msg.className = 'form-msg err';
    }
  }

  async function deleteHoliday(id) {
    if (!confirm('Remove this holiday?')) return;
    try {
      await fetch(BASE + '/holiday/' + id, { method: 'DELETE' });
      loadHolidays();
    } catch(e) {
      alert('Failed to delete holiday.');
    }
  }

  // ── HELPERS ──
  function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatDate(ts) {
    return new Date(ts).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
  }
</script>
</body>
</html>
