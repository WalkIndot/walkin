<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WalkIn. — Check In</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: white; border-radius: 16px; padding: 40px 32px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 2px 20px rgba(0,0,0,0.08); }
    .logo { font-size: 28px; font-weight: 700; letter-spacing: -1px; margin-bottom: 8px; }
    .logo span { color: #7C3AED; }
    .subtitle { color: #888; font-size: 15px; margin-bottom: 32px; }
    .barber-name { font-size: 18px; font-weight: 600; margin-bottom: 32px; color: #222; }
    label { display: block; text-align: left; font-size: 14px; color: #555; margin-bottom: 8px; font-weight: 500; }
    input { width: 100%; padding: 14px 16px; border: 1.5px solid #e0e0e0; border-radius: 10px; font-size: 16px; outline: none; transition: border 0.2s; }
    input:focus { border-color: #7C3AED; }
    button { width: 100%; padding: 14px; background: #7C3AED; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 16px; transition: background 0.2s; }
    button:hover { background: #6D28D9; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .message { margin-top: 20px; padding: 14px; border-radius: 10px; font-size: 15px; display: none; }
    .message.success { background: #ECFDF5; color: #065F46; display: block; }
    .message.error { background: #FEF2F2; color: #991B1B; display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">WalkIn<span>.</span></div>
    <div class="subtitle">Stay connected with your barber</div>
    <div class="barber-name">Nick Cuts</div>
    <label for="phone">Your mobile number</label>
    <input type="tel" id="phone" placeholder="e.g. 07700900001" />
    <button id="checkinBtn" onclick="checkIn()">Check in</button>
    <div id="message" class="message"></div>
  </div>

  <script>
    async function checkIn() {
      var phone = document.getElementById('phone').value.trim();
      var btn = document.getElementById('checkinBtn');
      var msg = document.getElementById('message');

      if (!phone) {
        msg.className = 'message error';
        msg.textContent = 'Please enter your mobile number.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Checking in...';
      msg.className = 'message';

      try {
        var response = await fetch('https://x8ki-letl-twmt.n7.xano.io/api:3BaFz8Nm/visit/checkin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: phone, shop_id: 1, barber_id: 1 })
        });

        var data = await response.json();

        if (response.ok) {
          msg.className = 'message success';
          msg.textContent = '✓ Checked in! We\'ll message you when you\'re due for your next cut.';
          btn.textContent = 'Checked in!';
        } else {
          msg.className = 'message error';
          msg.textContent = 'We couldn\'t find your number. Please register first.';
          btn.disabled = false;
          btn.textContent = 'Check in';
        }
      } catch(err) {
        msg.className = 'message error';
        msg.textContent = 'Something went wrong. Please try again.';
        btn.disabled = false;
        btn.textContent = 'Check in';
      }
    }
  </script>
</body>
</html>
