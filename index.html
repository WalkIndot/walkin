<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WalkIn. — Check In</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #1a1a1a; border: 1px solid #2e2e2e; border-radius: 4px; padding: 40px 32px; max-width: 400px; width: 100%; text-align: center; }
    .wordmark { font-size: 28px; font-weight: 800; letter-spacing: -1px; margin-bottom: 8px; color: #c8f060; font-family: Georgia, serif; }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 40px; font-family: monospace; }
    label { display: block; text-align: left; font-size: 11px; color: #888; margin-bottom: 6px; font-family: monospace; text-transform: uppercase; letter-spacing: 1px; }
    input { width: 100%; padding: 12px 14px; background: #0f0f0f; border: 1px solid #2e2e2e; border-radius: 2px; font-size: 15px; outline: none; transition: border 0.2s; color: #f0ede8; font-family: monospace; }
    input:focus { border-color: #c8f060; }
    button { width: 100%; padding: 13px; background: #c8f060; color: #0f0f0f; border: none; border-radius: 2px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 16px; transition: background 0.2s; font-family: Georgia, serif; letter-spacing: 0.5px; }
    button:hover { background: #a0c040; }
    button:disabled { background: #333; color: #666; cursor: not-allowed; }
    .message { margin-top: 20px; padding: 14px; border-radius: 2px; font-size: 13px; display: none; font-family: monospace; }
    .message.success { background: #1a2a1a; color: #60e090; display: block; }
    .message.error { background: #2a1a1a; color: #ff5c5c; display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="wordmark">WalkIn.</div>
    <div class="subtitle">Stay connected with your barber</div>
    <label for="phone">Your mobile number</label>
    <input type="tel" id="phone" placeholder="e.g. 07700 900001" />
    <button id="checkinBtn" onclick="checkIn()">Check in</button>
    <div id="message" class="message"></div>
  </div>

  <script>
    async function checkIn() {
      var phone = document.getElementById('phone').value.trim();
      var btn = document.getElementById('checkinBtn');
      var msg = document.getElementById('message');

      if (!phone) {
        msg.className = 'message error';
        msg.textContent = 'Please enter your mobile number.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Checking in...';
      msg.className = 'message';

      try {
        var response = await fetch('https://x8ki-letl-twmt.n7.xano.io/api:3BaFz8Nm/visit/checkin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: phone, shop_id: 1, barber_id: 1 })
        });

        var data = await response.json();

        if (response.ok) {
          msg.className = 'message success';
          msg.textContent = '✓ Checked in. We\'ll message you when you\'re due for your next cut.';
          btn.textContent = 'Checked in';
        } else {
          msg.className = 'message error';
          msg.textContent = 'We couldn\'t find your number. Please register with your barber first.';
          btn.disabled = false;
          btn.textContent = 'Check in';
        }
      } catch(err) {
        msg.className = 'message error';
        msg.textContent = 'Something went wrong. Please try again.';
        btn.disabled = false;
        btn.textContent = 'Check in';
      }
    }
  </script>
</body>
</html>
